# Batch specification consumed by the Isaac Sim scene generator.
camera:
  profile: d405_capture_20261004
  width: 640
  height: 480
  distortion_model: plumb_bob
  # RealSense aligned color optical stream measured on 2026-10-04.
  K: [393.4726257, 0, 314.7101440, 0, 392.9162903, 235.8206177, 0, 0, 1]
  D: [-0.05203464, 0.05406765, -0.00045569, 0.00029751, -0.01748787]
  P: [393.4726257, 0, 314.7101440, 0, 0, 392.9162903, 235.8206177, 0, 0, 0, 1, 0]
  # p_link6 = link6_T_camera * p_camera, metres.
  link6_T_camera: [[0.9977791863, -0.0662632332, -0.0067734228, -0.0123028218],
                   [0.0638580978, 0.9226997272, 0.3801938410, -0.0739755665],
                   [-0.0189430378, -0.3797820392, 0.9248820271, 0.0469442357],
                   [0, 0, 0, 1]]
  optical_frame: d405_color_optical_frame
  depth_encoding: 32FC1
  # Only affects the equivalent physical camera aperture; pixel intrinsics
  # and distortion below are applied directly to the Isaac camera sensor.
  pixel_size_um: 3.0
  # Required scene bounds in base_link; replace with the chosen scan workspace.
  base_roi: [-0.6, -0.6, 0.0, 0.6, 0.6, 1.2]
table:
  # The scene world is the robot base_link frame; tabletop is placed at z=0.
  top_z_m: 0.0
gripper:
  variant: 100mm
  opening_mm: [0, 50, 100]
object:
  mesh: ${SPRITE15_MESH}
  mesh_units: m
  # Measured from this sprite15 USD: its bottle axis is local +Y.
  upright_axis_mesh: [0, 1, 0]
  no_second_scale: true
  # Aim the camera around the upper half; fit GT is derived from this view's fit band.
  camera_aim_height_fraction: 0.55
  pose_grid:
    distance_m: [0.30, 0.45, 0.60]
    azimuth_deg: [-30, 0, 30]
    elevation_deg: [-15, 0, 15]
continuous:
  # Same azimuth/elevation keeps the calibrated approach orientation fixed;
  # the camera and TCP translations share the straight line and quintic timing.
  start_distance_m: 0.45
  end_distance_m: 0.18
  azimuth_deg: 0
  elevation_deg: 20
  frames: 90
  fps: 30
  grasp_height_m: 0.115
render:
  headless: true
  output_dir: /path/outside/repo/grasp-samples
  ground_truth_box: visible_tight
  depth: optical_z_m
  seed: 1
fitting:
  radius: 0.0275
  band_top: 0.48
  band_bottom: 0.62
  horizontal_margin: 0.10
  min_points: 30
  residual_tolerance: 0.0045
  min_supported_fraction: 0.55
